<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Waiting Room - Game Lobby</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>

    <body class="bg-light">
        <div th:fragment="waiting-room" class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="border-0">
                        <div class="border-0 rounded-4 overflow-hidden">
                            <div class="card-header bg-primary text-white text-center py-4">
                                <h3 class="mb-2">Lobby</h3>
                                <div class="badge bg-light text-dark mt-2" th:text="'Lobby Code: ' + ${lobbyCode}">
                                    Code: ABC123
                                </div>
                                <div class="mt-2 small" th:text="${playerList.size()} + ' player(s) waiting'">
                                    0 player(s) waiting
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-4 bg-transparent">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="mb-0">Players List</h5>
                                <span class="badge bg-secondary rounded-pill" th:text="${playerList.size()}">0</span>
                            </div>
                            
                            <!-- Player List as UL -->
                            <ul id="player-list" class="list-unstyled mb-0">
                                <li th:each="item : ${playerList}" class="mb-2">
                                    <div class="d-flex align-items-center p-2 border rounded">
                                        <div class="bg-primary  rounded-circle d-flex align-items-center justify-content-center me-3" 
                                             style="width: 40px; height: 40px;">
                                            <span th:text="${#strings.substring(item, 0, 1)}">U</span>
                                        </div>
                                        <span th:text="${item}" class="flex-grow-1">Username</span>
                                        <span th:if="${isOwner and item == playerList[0]}" 
                                              class="badge bg-warning text-dark">Owner</span>
                                    </div>
                                </li>
                                
                                <li th:if="${playerList.empty}" class="text-center text-muted py-4 border rounded ">
                                    Empty
                                </li>
                            </ul>
                        </div>
                        
                        <div th:if="${isOwner}" class="text-center">
                            <button id="start-button" class="btn btn-primary btn-lg px-5">
                                Iniciar partida
                            </button>
                        </div>
                        <div th:unless="${isOwner}" class="text-center text-muted small">
                            Waiting for host to start the game...
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
