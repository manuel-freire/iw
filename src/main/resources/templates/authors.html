<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <th:block th:replace="~{fragments/head :: header}" />
    <title th:text="#{authors.pageTitle}"></title>
   
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0">
        <div class="container py-5">
            <!-- Page Header -->
            <div class="text-center mb-5">
                <h1 class="display-4 fw-bold" th:text="#{authors.title}"></h1>
            </div>

            <!-- Authors Loop - CHANGED THIS LINE -->
            <div th:each="author : ${authorList}">
                <div class="card author-card shadow-sm mb-5 border-0">              
                    <div class="row g-0">
                        <div class="col-md-4 d-flex align-items-center justify-content-center p-4">
                            <img th:src="@{'/img/' + ${author.imageFileName}}"
                                 src="/img/TimofeyMatveev.jpeg"
                                 th:alt="#{authors.imageAlt}"
                                 alt="Imagen Aqui"
                                 class="author-img rounded-circle img-fluid">
                        </div>
                        <div class="col-md-8">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h2 class="card-title fw-bold" th:text="${author.firstName + ' ' + author.lastName}">Timofey Matveev</h2>
                                    </div>
                                </div>
                                <div class="social-links">
                                    <a th:href="${author.gitHubUrl}" 
                                       href="https://github.com/TimotyEnder" 
                                       class="me-3" 
                                       target="_blank"
                                       th:text="#{authors.github}">
                                        GitHub
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
</body>
</html>
